<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>매일함 나만의 링크</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Apple SD Gothic Neo,Roboto,Noto Sans KR,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
  <tr>
    <td align="center" style="padding:32px 24px;">
      <table role="presentation" width="100%" style="max-width:552px;" cellpadding="0" cellspacing="0">

        <!-- 로고 -->
        <tr>
          <td style="padding-bottom:48px;">
            <span style="font-size:17px;font-weight:700;color:#111111;letter-spacing:-0.3px;">매일함</span>
          </td>
        </tr>

        <!-- 타이틀 -->
        <tr>
          <td style="padding-bottom:32px;">
            <div style="font-size:26px;font-weight:700;line-height:1.4;color:#333d4b;">나만의 링크가 도착했어요.</div>
          </td>
        </tr>

        <!-- 안내 텍스트 -->
        <tr>
          <td style="padding-bottom:32px;">
            <div style="font-size:16px;color:#4e5968;line-height:1.7;">
              앞으로 아래 링크로 매일함을 이용해보세요.<br>
              이 링크로 들어오면 푼 문제 기록이 저장돼요. 링크를 처음 열면 가입이 완료됩니다.
            </div>
          </td>
        </tr>

        <!-- CTA 버튼 -->
        <tr>
          <td style="padding-bottom:48px;">
            <a href="{{.LinkURL}}" style="display:inline-block;background:#1a1108;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;padding:12px 24px;border-radius:8px;">내 링크로 시작하기 →</a>
          </td>
        </tr>

        <!-- 사용 안내 -->
        <tr>
          <td style="padding-bottom:32px;">
            <div style="font-size:15px;color:#4e5968;line-height:1.8;">
              · 즐겨찾기(북마크)에 넣어두면 편해요.<br>
              · 이 링크는 나만의 열쇠예요. 다른 사람에게 공유하지 마세요.<br>
              · 매일 아침 메일은 질문이 충분히 쌓이면 시작할게요.
            </div>
          </td>
        </tr>

        <!-- 구분선 -->
        <tr>
          <td style="padding-bottom:32px;">
            <p style="border-top:1px solid rgba(0,29,58,0.12);margin:0;font-size:1px;"></p>
          </td>
        </tr>

        <!-- 푸터 -->
        <tr>
          <td style="padding-bottom:32px;">
            <div style="font-size:13px;color:#8b95a1;line-height:1.7;">
              이 메일을 요청하지 않으셨다면 무시해주세요.<br><br>
              © 매일함. All Rights Reserved.<br><br>
              ※ 본 메일은 발신 전용이므로 회신 내용을 확인할 수 없습니다.
            </div>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
